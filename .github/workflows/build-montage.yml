name: Build stag montage

# Adds a "Run workflow" button on the Actions tab â€” no schedule, you trigger it.
on:
  workflow_dispatch:

jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the montage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python make_montage.py

      - name: Also save it here as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: stag-montage
          path: montage_work/stag-montage.mp4
          if-no-files-found: warn
